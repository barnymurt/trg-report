[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trg-agent"
version = "0.1.0"
description = "TRG multi-agent Claude system backend"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
  # ─── Core agent framework ──────────────────────────────────────────
  "smolagents>=1.10.0",
  "litellm>=1.51.0",

  # ─── Web framework ─────────────────────────────────────────────────
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "websockets>=13.0",

  # ─── Anthropic (direct SDK for fine-grained control) ──────────────
  "anthropic>=0.39.0",

  # ─── Vector DB + embeddings clients ────────────────────────────────
  "qdrant-client>=1.12.0",
  "httpx>=0.27.0",

  # ─── Storage / DB ──────────────────────────────────────────────────
  "aiosqlite>=0.20.0",
  "sqlmodel>=0.0.22",
  "alembic>=1.13.0",

  # ─── Document ingestion ────────────────────────────────────────────
  "docling>=2.0.0",
  "docling-core>=1.0.0",
  "pypdf>=5.0.0",
  "python-magic>=0.4.27",

  # ─── Auth (single-user, simple token) ──────────────────────────────
  "PyJWT>=2.9.0",
  "passlib[bcrypt]>=1.7.4",

  # ─── Observability ─────────────────────────────────────────────────
  "loguru>=0.7.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",

  # ─── Utilities ─────────────────────────────────────────────────────
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.0",
  "pydub>=0.25.0",
  "structlog>=24.4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
